[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cct"
version = "0.1.0"
description = "Claude Conversation Tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "aiosqlite>=0.20.0",
    "python-ulid>=2.2.0",
    "tomli>=2.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27.0"]

[project.scripts]
cct = "cct.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cct"]
