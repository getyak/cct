[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cct"
version = "0.1.0"
description = "Claude Conversation Tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn[standard]>=0.52.4,<0.53",
    "pydantic>=2.13.4,<3",
    "aiosqlite>=0.22.1,<0.23",
    "python-ulid>=4.0.1,<5",
    "tomli>=2.4.1,<3",
    "httpx>=0.28.1,<0.29",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1,<0.29",
    "pip-audit>=2.10.1,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16.4,<0.17",
]

[project.scripts]
cct = "cct.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cct"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
