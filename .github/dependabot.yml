version: 2
updates:
  - package-ecosystem: npm
    directory: /packages/frontend
    schedule:
      interval: weekly
      day: monday
      time: "20:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: pip
    directory: /packages/backend
    schedule:
      interval: weekly
      day: monday
      time: "20:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies, "python:uv"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "20:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)
