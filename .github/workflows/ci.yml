name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Security regression tests
        run: npm run test:security
      - name: Audit dependencies
        if: always()
        run: npm run audit
      - name: Preserve raw dependency audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dependency-audit-${{ github.sha }}
          path: packages/frontend/.audit/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Build
        run: npm run build

  backend:
    name: Backend tests and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: packages/backend/uv.lock
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Test
        run: uv run pytest
      - name: Lint
        run: uv run ruff check cct tests
      - name: Audit dependencies
        run: uv run pip-audit
      - name: Compile package
        run: uv run python -m compileall -q cct
